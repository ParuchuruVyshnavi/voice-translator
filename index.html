<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    AI Voice Translator
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  />

 

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

</head>

<body>

  <div class="container">

    <!-- TOP BAR -->

    <div class="top-bar">

      <h1>
        🎤 AI Voice Translator
      </h1>

      <button id="themeBtn">
        🌙 Theme
      </button>

    </div>

  

    <div class="translator-box">

      

      <div class="card">

        <h2>
          Voice Input
        </h2>

        <label>
          Speaking Language
        </label>

        <select id="sourceLang">

          <option value="te-IN">
            🇮🇳 Telugu
          </option>

          <option value="en-US">
            🇺🇸 English
          </option>

          <option value="ta-IN">
            🇮🇳 Tamil
          </option>

          <option value="hi-IN">
            🇮🇳 Hindi
          </option>

        </select>

        <textarea
          id="sourceText"
          placeholder="Speak or type here..."
        ></textarea>



        <p id="counter">
          Words: 0 | Characters: 0
        </p>

       

        <div class="voice-animation">

          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>

        </div>

      

        <div class="btn-group">

          <button onclick="startListening()">
            🎙 Start
          </button>

          <button onclick="swapLanguages()">
            🔄 Swap
          </button>

        </div>

      </div>

      

      <div class="card">

        <h2>
          Translated Output
        </h2>

        <label>
          Translate To
        </label>

        <select id="targetLang">

          <option value="en">
            🇺🇸 English
          </option>

          <option value="ta">
            🇮🇳 Tamil
          </option>

          <option value="te">
            🇮🇳 Telugu
          </option>

          <option value="hi">
            🇮🇳 Hindi
          </option>

        </select>

        <textarea
          id="translatedText"
          placeholder="Translation appears here..."
        ></textarea>

       

        <div class="btn-group">

          <button onclick="speakTranslation()">
            🔊 Speak
          </button>

          <button onclick="stopSpeaking()">
            ⏹ Stop
          </button>

        </div>

        <div class="btn-group">

          <button onclick="copyTranslation()">
            📋 Copy
          </button>

          <button onclick="downloadText()">
            📥 Download
          </button>

        </div>

        <div class="btn-group">

          <button onclick="saveFavorite()">
            ❤️ Favorite
          </button>

          <button onclick="clearAll()">
            🗑 Clear
          </button>

        </div>

        

        <div class="slider-box">

          <label>
            Voice Speed
          </label>

          <input
            type="range"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
            onchange="setRate(this.value)"
          />

        </div>

        <div class="slider-box">

          <label>
            Voice Pitch
          </label>

          <input
            type="range"
            min="0"
            max="2"
            step="0.1"
            value="1"
            onchange="setPitch(this.value)"
          />

        </div>

        <div class="slider-box">

          <label>
            Volume
          </label>

          <input
            type="range"
            min="0"
            max="1"
            step="0.1"
            value="1"
            onchange="setVolume(this.value)"
          />

        </div>

      </div>

    </div>

  

    <div class="history-card">

      <div class="history-top">

        <h2>
          📜 Translation History
        </h2>

        <button onclick="clearHistory()">
          Clear History
        </button>

      </div>

      <div id="history"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
